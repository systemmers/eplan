<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Style 01: Classic Centered - ePlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    STYLE 1: Classic Centered (현재 사용 중)
    - 중앙 정렬, 그라데이션 배경
    - 대형 타이틀 + 서브타이틀 + 태그라인
    - 심플하고 안정적인 디자인

    적용 대상: 메인 페이지, 회사소개
    로고: ../../app/static/images/eplan_logo_white.png
-->
<section style="
    position: relative;
    height: 100vh;
    min-height: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #00635C 0%, #63A19B 100%);
    color: white;
    text-align: center;
    padding: 2rem;
">
    <div style="max-width: 900px;">
        <!-- Logo -->
        <img src="../../app/static/images/eplan_logo_white.png" alt="ePlan" style="
            height: 70px;
            margin-bottom: 2rem;
        ">
        <h1 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        ">글로벌 교육의 혁신, ePlan</h1>
        <p style="
            font-size: clamp(1.25rem, 2.5vw, 1.75rem);
            margin-bottom: 0.75rem;
            opacity: 0.95;
        ">지식 파트너십을 통한 글로벌 성공 역량 강화</p>
        <p style="
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-style: italic;
            font-weight: 700;
            margin-top: 1.5rem;
        ">Practice Makes Perfect!</p>
    </div>
</section>
</body>
</html>
