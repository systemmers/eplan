<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Style 10: Wave Background - ePlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    STYLE 10: Wave Background Hero
    - 하단 웨이브 SVG 배경
    - 부드럽고 유기적인 느낌
    - 자연스러운 시각적 흐름

    적용 대상: 메인 페이지, 서비스 소개
    로고: ../../app/static/images/eplan_logo_white.png
-->
<section style="
    position: relative;
    height: 100vh;
    min-height: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #00635C 0%, #004d47 100%);
    color: white;
    text-align: center;
    padding: 2rem;
    overflow: hidden;
">
    <!-- Content -->
    <div style="
        position: relative;
        z-index: 1;
        max-width: 900px;
    ">
        <!-- Logo -->
        <img src="../../app/static/images/eplan_logo_white.png" alt="ePlan" style="
            height: 70px;
            margin-bottom: 2rem;
        ">
        <div style="
            display: inline-block;
            background: rgba(255, 183, 77, 0.2);
            border: 1px solid #FFB74D;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            margin-bottom: 2rem;
        ">
            <span style="
                font-size: 0.875rem;
                color: #FFB74D;
                font-weight: 600;
                letter-spacing: 0.1em;
            ">SINCE 2015</span>
        </div>

        <h1 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 1.5rem;
        ">글로벌 교육의 혁신,<br>ePlan</h1>

        <p style="
            font-size: clamp(1.125rem, 2vw, 1.5rem);
            opacity: 0.9;
            margin-bottom: 1rem;
            line-height: 1.7;
        ">지식 파트너십을 통한 글로벌 성공 역량 강화</p>

        <p style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-style: italic;
            font-weight: 600;
            margin: 2rem 0;
        ">Practice Makes Perfect!</p>

        <p style="
            font-size: 1.125rem;
            opacity: 0.85;
            margin-bottom: 2rem;
        ">Your success is just around the corner.</p>

        <button style="
            background: #FFB74D;
            color: #00635C;
            padding: 1.25rem 3rem;
            border: none;
            border-radius: 8px;
            font-size: 1.125rem;
            font-weight: 700;
            cursor: pointer;
        ">시작하기</button>
    </div>

    <!-- Wave SVG -->
    <svg style="
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: auto;
    " viewBox="0 0 1440 320" preserveAspectRatio="none">
        <path fill="rgba(255,255,255,0.1)" d="M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,144C672,139,768,181,864,197.3C960,213,1056,203,1152,176C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        <path fill="rgba(255,255,255,0.05)" d="M0,256L48,240C96,224,192,192,288,181.3C384,171,480,181,576,197.3C672,213,768,235,864,234.7C960,235,1056,213,1152,197.3C1248,181,1344,171,1392,165.3L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>
</section>
</body>
</html>
