<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Style 13: Geometric Pattern - ePlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    STYLE 13: Geometric Pattern Hero
    - 기하학적 패턴 배경
    - 구조적이고 전문적인 느낌
    - 테크/에듀테크 이미지

    적용 대상: 기업 서비스, B2B 페이지
    로고: ../../app/static/images/eplan_logo_white.png
-->
<section style="
    position: relative;
    height: 100vh;
    min-height: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #00635C;
    color: white;
    text-align: center;
    padding: 2rem;
    overflow: hidden;
">
    <!-- Geometric Pattern Background -->
    <svg style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.1;
    " viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
            <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
                <path d="M 10 0 L 0 0 0 10" fill="none" stroke="white" stroke-width="0.5"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"/>
    </svg>

    <!-- Floating Shapes -->
    <div style="
        position: absolute;
        top: 10%;
        left: 10%;
        width: 80px;
        height: 80px;
        border: 3px solid rgba(255, 183, 77, 0.3);
        transform: rotate(45deg);
    "></div>
    <div style="
        position: absolute;
        top: 20%;
        right: 15%;
        width: 60px;
        height: 60px;
        background: rgba(255, 183, 77, 0.2);
        border-radius: 50%;
    "></div>
    <div style="
        position: absolute;
        bottom: 15%;
        left: 20%;
        width: 100px;
        height: 100px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
    "></div>
    <div style="
        position: absolute;
        bottom: 25%;
        right: 10%;
        width: 50px;
        height: 50px;
        border: 3px solid rgba(99, 161, 155, 0.4);
        transform: rotate(45deg);
    "></div>

    <!-- Content -->
    <div style="
        position: relative;
        z-index: 1;
        max-width: 900px;
    ">
        <!-- Logo -->
        <img src="../../app/static/images/eplan_logo_white.png" alt="ePlan" style="
            height: 60px;
            margin-bottom: 2rem;
        ">
        <div style="
            display: inline-block;
            border: 1px solid rgba(255, 183, 77, 0.5);
            padding: 0.75rem 2rem;
            margin-bottom: 2rem;
        ">
            <span style="
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.3em;
                color: #FFB74D;
            ">Global Education Platform</span>
        </div>

        <h1 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        ">글로벌 교육의 혁신</h1>

        <h2 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 300;
            margin-bottom: 2rem;
            color: #63A19B;
        ">ePlan</h2>

        <p style="
            font-size: clamp(1rem, 2vw, 1.25rem);
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto 1.5rem;
            line-height: 1.8;
        ">지식 파트너십을 통한 글로벌 성공 역량 강화<br>
        Empowering Global Success Through Knowledge Partnership</p>

        <div style="
            margin: 2.5rem 0;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            display: inline-block;
        ">
            <p style="
                font-family: 'Poppins', sans-serif;
                font-size: clamp(1.5rem, 4vw, 3rem);
                font-style: italic;
                font-weight: 600;
                margin: 0;
                color: #FFB74D;
            ">Practice Makes Perfect!</p>
        </div>

        <p style="
            font-size: 1.125rem;
            opacity: 0.8;
            letter-spacing: 0.05em;
        ">Your success is just around the corner.</p>
    </div>
</section>
</body>
</html>
