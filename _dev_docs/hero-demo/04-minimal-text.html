<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Style 04: Minimal Text - ePlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    STYLE 4: Minimal Text Hero
    - 미니멀한 디자인, 단순한 텍스트
    - 넉넉한 여백과 타이포그래피 강조
    - 클린하고 세련된 느낌

    적용 대상: Writing 첨삭, 프리미엄 서비스
    로고: ../../app/static/images/eplan_logo.png
-->
<section style="
    position: relative;
    height: 100vh;
    min-height: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #FAFAFA;
    padding: 2rem;
">
    <div style="text-align: center; max-width: 1000px;">
        <!-- Logo -->
        <img src="../../app/static/images/eplan_logo.png" alt="ePlan" style="
            height: 60px;
            margin-bottom: 2rem;
        ">
        <p style="
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #FFB74D;
            font-weight: 600;
            margin-bottom: 2rem;
        ">Professional Language Education</p>
        <h1 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 300;
            color: #263238;
            line-height: 1;
            margin-bottom: 2rem;
        ">Learn.<br><span style="font-weight: 700; color: #00635C;">Practice.</span><br>Succeed.</h1>
        <div style="
            width: 60px;
            height: 4px;
            background: #00635C;
            margin: 0 auto 2rem;
        "></div>
        <p style="
            font-size: 1.125rem;
            color: #90A4AE;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.8;
        ">Practice Makes Perfect. ePlan과 함께라면 가능합니다.</p>
    </div>
</section>
</body>
</html>
