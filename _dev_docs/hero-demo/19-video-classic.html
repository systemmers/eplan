<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Style 19: Video Classic - ePlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    STYLE 19: Video Classic
    - 비디오 백그라운드 + 클래식 중앙 정렬
    - 로고 이미지 강조
    - 기본 오버레이

    적용 대상: 메인 페이지
    비디오: ../../app/static/videos/main.mp4
    로고: ../../app/static/images/eplan_logo_white.png
-->
<section style="
    position: relative;
    height: 100vh;
    min-height: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: white;
    text-align: center;
">
    <!-- Video Background -->
    <video autoplay muted loop playsinline style="
        position: absolute;
        top: 50%;
        left: 50%;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        transform: translate(-50%, -50%);
        z-index: -2;
        object-fit: cover;
    ">
        <source src="../../app/static/videos/main.mp4" type="video/mp4">
    </video>

    <!-- Dark Overlay -->
    <div style="
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: -1;
    "></div>

    <!-- Content -->
    <div style="
        position: relative;
        z-index: 1;
        max-width: 900px;
        padding: 2rem;
    ">
        <!-- Logo -->
        <img src="../../app/static/images/eplan_logo_white.png" alt="ePlan" style="
            height: 80px;
            margin-bottom: 2rem;
        ">

        <h1 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 1.5rem;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        ">글로벌 교육의 혁신</h1>

        <p style="
            font-size: clamp(1.125rem, 2vw, 1.5rem);
            opacity: 0.95;
            margin-bottom: 1rem;
            line-height: 1.7;
        ">지식 파트너십을 통한 글로벌 성공 역량 강화</p>

        <p style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-style: italic;
            font-weight: 700;
            margin: 2rem 0;
            color: #FFB74D;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        ">Practice Makes Perfect!</p>

        <p style="
            font-size: 1.125rem;
            opacity: 0.85;
            margin-bottom: 2rem;
        ">Your success is just around the corner.</p>

        <button style="
            background: #00635C;
            color: white;
            padding: 1.25rem 3rem;
            border: none;
            border-radius: 8px;
            font-size: 1.125rem;
            font-weight: 700;
            cursor: pointer;
        ">시작하기</button>
    </div>
</section>
</body>
</html>
