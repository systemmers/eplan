<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Style 30: Video Framed - ePlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    STYLE 30: Video Framed
    - 비디오 백그라운드 + 프레임 디자인
    - 보더 프레임으로 콘텐츠 강조
    - 갤러리 느낌

    적용 대상: 프리미엄, 특별 이벤트
    비디오: ../../app/static/videos/main.mp4
    로고: ../../app/static/images/eplan_logo_white.png
-->
<section style="
    position: relative;
    height: 100vh;
    min-height: 700px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 2rem;
">
    <!-- Video Background -->
    <video autoplay muted loop playsinline style="
        position: absolute;
        top: 50%;
        left: 50%;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        transform: translate(-50%, -50%);
        z-index: -2;
        object-fit: cover;
    ">
        <source src="../../app/static/videos/main.mp4" type="video/mp4">
    </video>

    <!-- Dark Overlay -->
    <div style="
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: -1;
    "></div>

    <!-- Frame Border -->
    <div style="
        position: absolute;
        inset: 3rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
        pointer-events: none;
        z-index: 1;
    "></div>

    <!-- Corner Decorations -->
    <div style="position: absolute; top: 3rem; left: 3rem; width: 30px; height: 30px; border-top: 3px solid #FFB74D; border-left: 3px solid #FFB74D; z-index: 2;"></div>
    <div style="position: absolute; top: 3rem; right: 3rem; width: 30px; height: 30px; border-top: 3px solid #FFB74D; border-right: 3px solid #FFB74D; z-index: 2;"></div>
    <div style="position: absolute; bottom: 3rem; left: 3rem; width: 30px; height: 30px; border-bottom: 3px solid #FFB74D; border-left: 3px solid #FFB74D; z-index: 2;"></div>
    <div style="position: absolute; bottom: 3rem; right: 3rem; width: 30px; height: 30px; border-bottom: 3px solid #FFB74D; border-right: 3px solid #FFB74D; z-index: 2;"></div>

    <!-- Content -->
    <div style="
        position: relative;
        z-index: 3;
        max-width: 800px;
        text-align: center;
        color: white;
        padding: 2rem;
    ">
        <!-- Logo -->
        <img src="../../app/static/images/eplan_logo_white.png" alt="ePlan" style="
            height: 60px;
            margin-bottom: 2rem;
        ">

        <p style="
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: #FFB74D;
            margin-bottom: 1.5rem;
        ">Since 2015</p>

        <h1 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            text-shadow: 0 4px 30px rgba(0,0,0,0.5);
        ">글로벌 교육의 혁신</h1>

        <div style="
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin: 2rem 0;
        ">
            <span style="flex: 1; max-width: 80px; height: 1px; background: rgba(255,255,255,0.5);"></span>
            <p style="
                font-size: 1.125rem;
                opacity: 0.9;
                margin: 0;
            ">지식 파트너십을 통한 글로벌 성공 역량 강화</p>
            <span style="flex: 1; max-width: 80px; height: 1px; background: rgba(255,255,255,0.5);"></span>
        </div>

        <p style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.75rem, 4vw, 3rem);
            font-style: italic;
            font-weight: 600;
            color: #FFB74D;
            margin: 2rem 0;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        ">Practice Makes Perfect!</p>

        <p style="
            font-size: 1rem;
            opacity: 0.7;
        ">Your success is just around the corner.</p>

        <button style="
            background: transparent;
            color: white;
            padding: 1rem 2.5rem;
            border: 2px solid white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
            letter-spacing: 0.1em;
        ">EXPLORE</button>
    </div>
</section>
</body>
</html>
