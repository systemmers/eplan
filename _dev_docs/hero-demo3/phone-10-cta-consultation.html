<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone English - CTA Consultation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .cta-btn {
            transition: all 0.3s ease;
        }
        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .feature-item {
            transition: all 0.3s ease;
        }
        .feature-item:hover {
            transform: translateX(5px);
        }
    </style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    PHONE ENGLISH - SECTION 10: CTA Consultation
    - 상담 신청 CTA 섹션
    - 특징 요약 및 폼
    - 강조 배경 디자인
-->
<section style="
    position: relative;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f1a 100%);
    color: white;
    padding: 4rem 2rem;
    display: flex;
    align-items: center;
">
    <!-- Background Pattern -->
    <div style="
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
            radial-gradient(circle at 20% 80%, rgba(0,99,92,0.3) 0%, transparent 50%),
            radial-gradient(circle at 80% 20%, rgba(255,183,77,0.2) 0%, transparent 50%);
        pointer-events: none;
    "></div>

    <div style="max-width: 1100px; margin: 0 auto; position: relative; z-index: 1;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center;">
            <!-- Left: Content -->
            <div>
                <span style="
                    display: inline-block;
                    background: linear-gradient(135deg, #00635C, #63A19B);
                    color: white;
                    padding: 0.5rem 1.5rem;
                    border-radius: 50px;
                    font-size: 0.875rem;
                    font-weight: 600;
                    margin-bottom: 1.5rem;
                ">FREE CONSULTATION</span>
                <h2 style="
                    font-family: 'Poppins', sans-serif;
                    font-size: clamp(2rem, 5vw, 3rem);
                    font-weight: 700;
                    margin: 0 0 1rem;
                    line-height: 1.2;
                ">지금 바로<br><span style="color: #FFB74D;">무료 상담</span>을<br>신청하세요</h2>
                <p style="
                    font-size: 1.1rem;
                    opacity: 0.9;
                    line-height: 1.7;
                    margin: 0 0 2rem;
                ">전문 상담사가 레벨 테스트와 함께 최적의 학습 플랜을 제안해 드립니다.</p>

                <!-- Features -->
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    <div class="feature-item" style="display: flex; align-items: center; gap: 1rem;">
                        <div style="
                            width: 40px;
                            height: 40px;
                            background: rgba(16,185,129,0.2);
                            border-radius: 10px;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                        ">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <span style="font-size: 0.95rem;">무료 레벨 테스트 제공</span>
                    </div>
                    <div class="feature-item" style="display: flex; align-items: center; gap: 1rem;">
                        <div style="
                            width: 40px;
                            height: 40px;
                            background: rgba(16,185,129,0.2);
                            border-radius: 10px;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                        ">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <span style="font-size: 0.95rem;">맞춤형 커리큘럼 설계</span>
                    </div>
                    <div class="feature-item" style="display: flex; align-items: center; gap: 1rem;">
                        <div style="
                            width: 40px;
                            height: 40px;
                            background: rgba(16,185,129,0.2);
                            border-radius: 10px;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                        ">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <span style="font-size: 0.95rem;">첫 수업 무료 체험</span>
                    </div>
                    <div class="feature-item" style="display: flex; align-items: center; gap: 1rem;">
                        <div style="
                            width: 40px;
                            height: 40px;
                            background: rgba(16,185,129,0.2);
                            border-radius: 10px;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                        ">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <span style="font-size: 0.95rem;">24시간 내 상담 연락</span>
                    </div>
                </div>
            </div>

            <!-- Right: Form -->
            <div style="
                background: rgba(255,255,255,0.1);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.2);
                border-radius: 24px;
                padding: 2.5rem;
            ">
                <h3 style="font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700; margin: 0 0 1.5rem; text-align: center;">상담 신청</h3>

                <form style="display: flex; flex-direction: column; gap: 1rem;">
                    <div>
                        <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.5rem;">이름</label>
                        <input type="text" placeholder="홍길동" style="
                            width: 100%;
                            padding: 1rem;
                            background: rgba(255,255,255,0.1);
                            border: 1px solid rgba(255,255,255,0.2);
                            border-radius: 10px;
                            color: white;
                            font-size: 1rem;
                            box-sizing: border-box;
                        ">
                    </div>
                    <div>
                        <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.5rem;">연락처</label>
                        <input type="tel" placeholder="010-1234-5678" style="
                            width: 100%;
                            padding: 1rem;
                            background: rgba(255,255,255,0.1);
                            border: 1px solid rgba(255,255,255,0.2);
                            border-radius: 10px;
                            color: white;
                            font-size: 1rem;
                            box-sizing: border-box;
                        ">
                    </div>
                    <div>
                        <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.5rem;">관심 과정</label>
                        <select style="
                            width: 100%;
                            padding: 1rem;
                            background: rgba(255,255,255,0.1);
                            border: 1px solid rgba(255,255,255,0.2);
                            border-radius: 10px;
                            color: white;
                            font-size: 1rem;
                            box-sizing: border-box;
                        ">
                            <option value="" style="color: #1a1a1a;">선택해주세요</option>
                            <option value="general" style="color: #1a1a1a;">일반회화</option>
                            <option value="business" style="color: #1a1a1a;">비즈니스회화</option>
                            <option value="discussion" style="color: #1a1a1a;">토론영어</option>
                            <option value="test" style="color: #1a1a1a;">시험대비</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.5rem;">희망 연락 시간</label>
                        <select style="
                            width: 100%;
                            padding: 1rem;
                            background: rgba(255,255,255,0.1);
                            border: 1px solid rgba(255,255,255,0.2);
                            border-radius: 10px;
                            color: white;
                            font-size: 1rem;
                            box-sizing: border-box;
                        ">
                            <option value="" style="color: #1a1a1a;">선택해주세요</option>
                            <option value="morning" style="color: #1a1a1a;">오전 (09:00-12:00)</option>
                            <option value="afternoon" style="color: #1a1a1a;">오후 (12:00-18:00)</option>
                            <option value="evening" style="color: #1a1a1a;">저녁 (18:00-21:00)</option>
                        </select>
                    </div>
                    <button type="submit" class="cta-btn" style="
                        background: linear-gradient(135deg, #FFB74D 0%, #FFA726 100%);
                        color: #1a1a1a;
                        border: none;
                        padding: 1.25rem;
                        border-radius: 12px;
                        font-size: 1.1rem;
                        font-weight: 700;
                        cursor: pointer;
                        margin-top: 0.5rem;
                    ">무료 상담 신청하기</button>
                </form>

                <p style="font-size: 0.75rem; text-align: center; opacity: 0.7; margin: 1rem 0 0;">
                    상담 신청 시 개인정보 처리방침에 동의하게 됩니다
                </p>
            </div>
        </div>

        <!-- Bottom Stats -->
        <div style="
            margin-top: 4rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
            text-align: center;
            padding-top: 3rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        ">
            <div>
                <div style="font-family: 'Poppins', sans-serif; font-size: 2.5rem; font-weight: 700; color: #FFB74D;">15,000+</div>
                <div style="font-size: 0.9rem; opacity: 0.8;">누적 수강생</div>
            </div>
            <div>
                <div style="font-family: 'Poppins', sans-serif; font-size: 2.5rem; font-weight: 700; color: #FFB74D;">500+</div>
                <div style="font-size: 0.9rem; opacity: 0.8;">원어민 강사</div>
            </div>
            <div>
                <div style="font-family: 'Poppins', sans-serif; font-size: 2.5rem; font-weight: 700; color: #FFB74D;">4.9</div>
                <div style="font-size: 0.9rem; opacity: 0.8;">수강생 만족도</div>
            </div>
            <div>
                <div style="font-family: 'Poppins', sans-serif; font-size: 2.5rem; font-weight: 700; color: #FFB74D;">24시간</div>
                <div style="font-size: 0.9rem; opacity: 0.8;">빠른 상담 연결</div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
