<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Accordion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 1rem;
        }

        /* Main Section Layout */
        .section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 3rem;
        }

        /* Left Side: Text Content */
        .content {
            width: 100%;
            text-align: center;
        }

        .content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #111827;
            line-height: 1.2;
            letter-spacing: -0.025em;
            margin-bottom: 1.5rem;
        }

        .content p {
            font-size: 1.125rem;
            color: #4b5563;
            max-width: 40rem;
            margin: 0 auto 2rem;
        }

        .cta-button {
            display: inline-block;
            background-color: #111827;
            color: white;
            font-weight: 600;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            text-decoration: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s;
        }

        .cta-button:hover {
            background-color: #1f2937;
        }

        /* Right Side: Image Accordion */
        .accordion-wrapper {
            width: 100%;
        }

        .accordion-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            overflow-x: auto;
        }

        /* Accordion Item */
        .accordion-item {
            position: relative;
            height: 450px;
            border-radius: 1rem;
            overflow: hidden;
            cursor: pointer;
            transition: width 0.7s ease-in-out;
            flex-shrink: 0;
        }

        .accordion-item.inactive {
            width: 60px;
        }

        .accordion-item.active {
            width: 300px; /* Adjust as needed */
        }

        /* Background Image */
        .accordion-item img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Dark Overlay */
        .accordion-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
        }

        /* Caption Text */
        .accordion-caption {
            position: absolute;
            color: white;
            font-size: 1.125rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s ease-in-out;
        }

        /* Active state: horizontal, bottom-center */
        .accordion-item.active .accordion-caption {
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) rotate(0deg);
        }

        /* Inactive state: vertical, bottom */
        .accordion-item.inactive .accordion-caption {
            bottom: 6rem;
            left: 50%;
            transform: translateX(-50%) rotate(90deg);
            width: auto;
            text-align: left;
        }

        /* Responsive Design */
        @media (min-width: 768px) {
            .section {
                flex-direction: row;
            }

            .content {
                width: 50%;
                text-align: left;
            }

            .content h1 {
                font-size: 3.75rem;
            }

            .content p {
                margin-left: 0;
                margin-right: 0;
            }

            .accordion-wrapper {
                width: 50%;
            }
        }

        @media (max-width: 767px) {
            .content h1 {
                font-size: 2rem;
            }

            .accordion-item {
                height: 350px;
            }

            .accordion-item.active {
                width: 300px;
            }

            .accordion-item.inactive {
                width: 50px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1rem;
            }

            .content h1 {
                font-size: 1.75rem;
            }

            .content p {
                font-size: 1rem;
            }

            .accordion-item {
                height: 300px;
            }

            .accordion-item.active {
                width: 250px;
            }

            .accordion-item.inactive {
                width: 40px;
            }

            .accordion-caption {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="section">
            <!-- Left Side: Text Content -->
            <div class="content">
                <h1>PRACTICE makes PERFECT</h1>
                <p>
                    AI Training Programs for businesses to enhance global talent and competitiveness.
                </p>
                <a href="#contact" class="cta-button">Contact Us</a>
            </div>

            <!-- Right Side: Image Accordion -->
            <div class="accordion-wrapper">
                <div class="accordion-container" id="accordionContainer">
                    <!-- Accordion items will be inserted here by JavaScript -->
                </div>
            </div>
        </section>
    </div>

    <script>
        // Accordion data
        const accordionItems = [
            {
                id: 1,
                title: 'General Conversation',
                imageUrl: 'https://images.unsplash.com/photo-1628258334105-2a0b3d6efee1?q=80&w=1974&auto=format&fit=crop'
            },
            {
                id: 2,
                title: 'Business English',
                imageUrl: 'https://images.unsplash.com/photo-1677756119517-756a188d2d94?q=80&w=2070&auto=format&fit=crop'
            },
            {
                id: 3,
                title: 'Industry-Specific',
                imageUrl: 'https://images.unsplash.com/photo-1515879218367-8466d910aaa4?q=80&w=1974&auto=format&fit=crop'
            },
            {
                id: 4,
                title: 'Test Preparation',
                imageUrl: 'https://images.unsplash.com/photo-1526628953301-3e589a6a8b74?q=80&w=2090&auto=format&fit=crop'
            }
        ];

        class InteractiveAccordion {
            constructor(items, containerId) {
                this.items = items;
                this.container = document.getElementById(containerId);
                this.activeIndex = 0; // Default: first item active (index 0)
                this.init();
            }

            init() {
                this.render();
                this.attachEventListeners();
            }

            render() {
                this.container.innerHTML = '';

                this.items.forEach((item, index) => {
                    const accordionItem = this.createAccordionItem(item, index);
                    this.container.appendChild(accordionItem);
                });
            }

            createAccordionItem(item, index) {
                const isActive = index === this.activeIndex;

                // Create main container
                const div = document.createElement('div');
                div.className = `accordion-item ${isActive ? 'active' : 'inactive'}`;
                div.dataset.index = index;

                // Create image
                const img = document.createElement('img');
                img.src = item.imageUrl;
                img.alt = item.title;
                img.loading = 'lazy';
                img.onerror = function() {
                    this.src = 'https://placehold.co/400x450/2d3748/ffffff?text=Image+Error';
                };

                // Create overlay
                const overlay = document.createElement('div');
                overlay.className = 'accordion-overlay';

                // Create caption
                const caption = document.createElement('span');
                caption.className = 'accordion-caption';
                caption.textContent = item.title;

                // Assemble
                div.appendChild(img);
                div.appendChild(overlay);
                div.appendChild(caption);

                return div;
            }

            attachEventListeners() {
                const items = this.container.querySelectorAll('.accordion-item');

                items.forEach((item, index) => {
                    item.addEventListener('mouseenter', () => {
                        this.setActive(index);
                    });

                    // Keyboard accessibility
                    item.setAttribute('tabindex', '0');
                    item.setAttribute('role', 'button');
                    item.setAttribute('aria-label', this.items[index].title);

                    item.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            this.setActive(index);
                            e.preventDefault();
                        }
                    });
                });
            }

            setActive(index) {
                if (this.activeIndex === index) return;

                this.activeIndex = index;

                const items = this.container.querySelectorAll('.accordion-item');
                items.forEach((item, idx) => {
                    if (idx === index) {
                        item.classList.remove('inactive');
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                        item.classList.add('inactive');
                    }
                });
            }
        }

        // Initialize accordion on page load
        document.addEventListener('DOMContentLoaded', () => {
            new InteractiveAccordion(accordionItems, 'accordionContainer');
        });
    </script>
</body>
</html>
