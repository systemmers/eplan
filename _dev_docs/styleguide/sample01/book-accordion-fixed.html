<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비즈니스 영어 교재 라이브러리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Accordion item transition */
    .accordion-item {
      transition: width 0.7s ease-in-out;
    }
    
    /* Caption transition - 원본과 동일하게 all 속성 전환 */
    .accordion-item .caption {
      transition: all 0.3s ease-in-out;
    }
    
    /* Overlay transition */
    .accordion-item .overlay {
      transition: background-color 0.3s ease-in-out;
    }
    
    /* Book detail fade in animation */
    .book-detail {
      animation: fadeIn 0.4s ease-in-out;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Hide scrollbar but allow scrolling */
    .accordion-container::-webkit-scrollbar {
      display: none;
    }
    .accordion-container {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    /* Active caption state: horizontal, bottom-center */
    .accordion-item.active .caption {
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) rotate(0deg);
    }
    
    /* Inactive caption state: vertical (rotated 90deg), positioned at bottom */
    .accordion-item:not(.active) .caption {
      bottom: 6rem;
      left: 50%;
      transform: translateX(-50%) rotate(90deg);
    }
    
    /* Responsive adjustments for inactive caption position */
    @media (min-width: 768px) {
      .accordion-item:not(.active) .caption {
        bottom: 5rem;
      }
    }
    
    @media (min-width: 1024px) {
      .accordion-item:not(.active) .caption {
        bottom: 6rem;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 font-sans min-h-screen">
  
  <section class="container mx-auto px-4 py-8 md:py-12">
    <!-- Header -->
    <div class="text-center mb-8 md:mb-12">
      <h1 class="text-2xl md:text-4xl font-bold text-gray-900 tracking-tight">
        비즈니스 영어 교재 라이브러리
      </h1>
      <p class="mt-2 md:mt-3 text-gray-600 text-sm md:text-base">
        교재를 선택하여 상세 정보를 확인하세요
      </p>
    </div>

    <div class="flex flex-col lg:flex-row items-start justify-between gap-6 lg:gap-10">
      
      <!-- Left Side: Selected Book Details -->
      <div id="bookDetail" class="w-full lg:w-1/2 bg-white rounded-2xl md:rounded-3xl shadow-xl p-6 md:p-8 order-2 lg:order-1 book-detail">
        <!-- Content will be dynamically inserted -->
      </div>

      <!-- Right Side: Book Accordion -->
      <div class="w-full lg:w-1/2 order-1 lg:order-2">
        <div id="accordionContainer" class="accordion-container flex flex-row items-center justify-center gap-2 md:gap-3 overflow-x-auto p-3 md:p-4 pb-4 md:pb-6">
          <!-- Accordion items will be dynamically inserted -->
        </div>
        <p class="text-center text-xs md:text-sm text-gray-500 mt-2">
          마우스를 올리거나 클릭하여 책을 선택하세요
        </p>
      </div>
    </div>
  </section>

  <script>
    // --- 책 데이터 ---
    const bookItems = [
      {
        id: 1,
        title: 'Business Result',
        author: 'John Hughes & Jon Naunton',
        publisher: 'Oxford University Press',
        year: '2017',
        rating: 4.5,
        level: 'Intermediate',
        description: '실제 비즈니스 상황에서 바로 활용 가능한 실용적인 영어 표현을 학습합니다. 회의, 프레젠테이션, 협상 등 다양한 비즈니스 시나리오를 다룹니다.',
        features: ['실제 비즈니스 케이스 스터디', '비디오 자료 포함', '온라인 학습 지원'],
        imageUrl: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?q=80&w=1974&auto=format&fit=crop',
      },
      {
        id: 2,
        title: 'English for Meetings',
        author: 'Kenneth Thomson',
        publisher: 'Oxford University Press',
        year: '2019',
        rating: 4.7,
        level: 'Upper-Intermediate',
        description: '효과적인 회의 진행과 참여를 위한 필수 영어 표현을 집중적으로 학습합니다. 의견 제시, 동의/반대 표현, 회의 마무리 등을 다룹니다.',
        features: ['회의 롤플레이 연습', '오디오 자료 제공', '즉시 활용 가능한 표현'],
        imageUrl: 'https://images.unsplash.com/photo-1552664730-d307ca884978?q=80&w=2070&auto=format&fit=crop',
      },
      {
        id: 3,
        title: 'Market Leader',
        author: 'David Cotton',
        publisher: 'Pearson Education',
        year: '2020',
        rating: 4.8,
        level: 'Advanced',
        description: 'Financial Times의 실제 기사를 활용한 비즈니스 영어 학습서입니다. 마케팅, 재무, 인사 등 다양한 비즈니스 영역을 심도있게 다룹니다.',
        features: ['FT 기사 기반 콘텐츠', '케이스 스터디', '비즈니스 스킬 개발'],
        imageUrl: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=1974&auto=format&fit=crop',
      },
      {
        id: 4,
        title: 'Email English',
        author: 'Paul Emmerson',
        publisher: 'Macmillan Education',
        year: '2018',
        rating: 4.6,
        level: 'Intermediate',
        description: '비즈니스 이메일 작성에 필요한 모든 표현과 형식을 학습합니다. 문의, 요청, 불만 처리 등 상황별 이메일 템플릿을 제공합니다.',
        features: ['50+ 이메일 템플릿', '문화적 차이 설명', '즉시 활용 가능'],
        imageUrl: 'https://images.unsplash.com/photo-1596526131083-e8c633c948d2?q=80&w=1974&auto=format&fit=crop',
      },
      {
        id: 5,
        title: 'Presentation Skills',
        author: 'Marion Grussendorf',
        publisher: 'Oxford University Press',
        year: '2021',
        rating: 4.9,
        level: 'All Levels',
        description: '효과적인 프레젠테이션을 위한 영어 표현과 기술을 학습합니다. 오프닝, 본론 전개, Q&A 대응 등 단계별 스킬을 다룹니다.',
        features: ['실전 프레젠테이션 연습', '비주얼 자료 활용법', '긴장 관리 팁'],
        imageUrl: 'https://images.unsplash.com/photo-1475721027785-f74eccf877e2?q=80&w=2070&auto=format&fit=crop',
      },
    ];

    // SVG Icons
    const icons = {
      bookOpen: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>`,
      user: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`,
      calendar: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`,
      chevronRight: `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>`,
      bookOpenSmall: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>`,
    };

    // State
    let activeIndex = 0;

    // Generate star rating HTML
    function generateStarRating(rating) {
      let starsHtml = '';
      for (let i = 0; i < 5; i++) {
        const filled = i < Math.floor(rating);
        starsHtml += `
          <span class="${filled ? 'text-yellow-400' : 'text-gray-300'}" style="${filled ? 'fill: #facc15;' : ''}">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" ${filled ? 'fill="currentColor"' : 'fill="none"'} stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </span>
        `;
      }
      return `
        <div class="flex items-center gap-1">
          ${starsHtml}
          <span class="ml-1 text-sm text-gray-600">${rating}</span>
        </div>
      `;
    }

    // Generate features list HTML
    function generateFeaturesList(features) {
      return features.map(feature => `
        <li class="flex items-center gap-2 text-gray-600 text-sm">
          <div class="w-1.5 h-1.5 bg-blue-500 rounded-full flex-shrink-0"></div>
          ${feature}
        </li>
      `).join('');
    }

    // Update book detail panel
    function updateBookDetail(book) {
      const detailContainer = document.getElementById('bookDetail');
      detailContainer.innerHTML = `
        <div class="flex items-start gap-3 md:gap-4 mb-4 md:mb-6">
          <div class="bg-blue-100 rounded-xl p-2.5 md:p-3 flex-shrink-0">
            <span class="text-blue-600 w-6 h-6 md:w-8 md:h-8 block">${icons.bookOpen}</span>
          </div>
          <div>
            <span class="text-xs font-medium text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full">
              ${book.level}
            </span>
            <h2 class="text-xl md:text-2xl lg:text-3xl font-bold text-gray-900 mt-2">
              ${book.title}
            </h2>
          </div>
        </div>

        <!-- Book Info -->
        <div class="space-y-2.5 md:space-y-4 mb-5 md:mb-6">
          <div class="flex items-center gap-2.5 md:gap-3 text-gray-600 text-sm">
            <span class="text-gray-400">${icons.user}</span>
            <span>${book.author}</span>
          </div>
          <div class="flex items-center gap-2.5 md:gap-3 text-gray-600 text-sm">
            <span class="text-gray-400">${icons.calendar}</span>
            <span>${book.publisher} · ${book.year}</span>
          </div>
          ${generateStarRating(book.rating)}
        </div>

        <!-- Description -->
        <div class="mb-5 md:mb-6">
          <h3 class="text-base md:text-lg font-semibold text-gray-900 mb-2">교재 소개</h3>
          <p class="text-gray-600 text-sm md:text-base leading-relaxed">
            ${book.description}
          </p>
        </div>

        <!-- Features -->
        <div class="mb-6 md:mb-8">
          <h3 class="text-base md:text-lg font-semibold text-gray-900 mb-2 md:mb-3">주요 특징</h3>
          <ul class="space-y-1.5 md:space-y-2">
            ${generateFeaturesList(book.features)}
          </ul>
        </div>

        <!-- CTA Buttons -->
        <div class="flex gap-3 md:gap-4">
          <button class="flex-1 bg-gray-900 text-white font-semibold px-5 md:px-6 py-2.5 md:py-3 rounded-xl shadow-lg hover:bg-gray-800 transition-colors duration-300 text-sm md:text-base">
            교재 상세보기
          </button>
          <button class="px-5 md:px-6 py-2.5 md:py-3 border-2 border-gray-200 text-gray-700 font-semibold rounded-xl hover:bg-gray-50 transition-colors duration-300 text-sm md:text-base">
            샘플 보기
          </button>
        </div>
      `;
      
      // Re-trigger animation
      detailContainer.classList.remove('book-detail');
      void detailContainer.offsetWidth; // Force reflow
      detailContainer.classList.add('book-detail');
    }

    // Update accordion items (without re-creating DOM - preserves animation)
    function updateAccordionStates() {
      const container = document.getElementById('accordionContainer');
      const items = container.querySelectorAll('.accordion-item');
      
      items.forEach((item, index) => {
        const isActive = index === activeIndex;
        
        // Update width classes
        if (isActive) {
          item.classList.remove('w-10', 'md:w-12', 'lg:w-14');
          item.classList.add('w-36', 'md:w-48', 'lg:w-64', 'active');
        } else {
          item.classList.remove('w-36', 'md:w-48', 'lg:w-64', 'active');
          item.classList.add('w-10', 'md:w-12', 'lg:w-14');
        }
        
        // Update overlay
        const overlay = item.querySelector('.overlay');
        if (isActive) {
          overlay.classList.remove('bg-black/60');
          overlay.classList.add('bg-black/40');
        } else {
          overlay.classList.remove('bg-black/40');
          overlay.classList.add('bg-black/60');
        }
        
        // Update book icon visibility
        const bookIcon = item.querySelector('.book-icon');
        if (bookIcon) {
          bookIcon.style.display = isActive ? 'none' : 'block';
        }
        
        // Update active indicator visibility
        const activeIndicator = item.querySelector('.active-indicator');
        if (activeIndicator) {
          activeIndicator.style.display = isActive ? 'block' : 'none';
        }
      });
    }

    // Create accordion item (initial render)
    function createAccordionItem(item, index) {
      const isActive = index === activeIndex;
      
      const div = document.createElement('div');
      div.className = `
        accordion-item relative rounded-2xl overflow-hidden cursor-pointer shadow-lg flex-shrink-0
        h-64 md:h-80 lg:h-96
        ${isActive ? 'w-36 md:w-48 lg:w-64 active' : 'w-10 md:w-12 lg:w-14'}
      `;
      div.dataset.index = index;
      
      div.innerHTML = `
        <!-- Background Image -->
        <img
          src="${item.imageUrl}"
          alt="${item.title}"
          class="absolute inset-0 w-full h-full object-cover"
          onerror="this.onerror=null; this.src='https://placehold.co/400x450/2d3748/ffffff?text=Book+Cover';"
        />
        
        <!-- Dark overlay -->
        <div class="overlay absolute inset-0 ${isActive ? 'bg-black/40' : 'bg-black/60'}"></div>

        <!-- Book Icon for inactive state -->
        <div class="book-icon absolute top-3 left-1/2 -translate-x-1/2 text-white/80" style="display: ${isActive ? 'none' : 'block'}">
          ${icons.bookOpenSmall}
        </div>

        <!-- Caption Text - 단일 요소, CSS로 회전/위치 제어 (원본과 동일) -->
        <span class="caption absolute text-white text-sm md:text-base lg:text-lg font-semibold whitespace-nowrap">
          ${item.title}
        </span>

        <!-- Active indicator -->
        <div class="active-indicator absolute top-3 md:top-4 right-3 md:right-4 bg-white/20 backdrop-blur-sm rounded-full p-1.5 md:p-2 text-white" style="display: ${isActive ? 'block' : 'none'}">
          ${icons.chevronRight}
        </div>
      `;
      
      // Event listeners
      div.addEventListener('mouseenter', () => handleItemHover(index));
      div.addEventListener('click', () => handleItemClick(index));
      
      return div;
    }

    // Handle hover
    function handleItemHover(index) {
      if (activeIndex !== index) {
        activeIndex = index;
        updateAccordionStates();
        updateBookDetail(bookItems[index]);
      }
    }

    // Handle click
    function handleItemClick(index) {
      activeIndex = index;
      updateAccordionStates();
      updateBookDetail(bookItems[index]);
    }

    // Initial render
    function renderAccordion() {
      const container = document.getElementById('accordionContainer');
      container.innerHTML = '';
      
      bookItems.forEach((item, index) => {
        const accordionItem = createAccordionItem(item, index);
        container.appendChild(accordionItem);
      });
    }

    // Initialize
    function init() {
      renderAccordion();
      updateBookDetail(bookItems[activeIndex]);
    }

    // Run on DOM ready
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
