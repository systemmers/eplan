<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Modal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Trigger Button */
    .modal-trigger {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      height: 2.5rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      background-color: #000;
      color: #fff;
      border: 1px solid #262626;
      cursor: pointer;
      overflow: hidden;
      min-width: 140px;
    }

    .modal-trigger:hover {
      background-color: rgba(0, 0, 0, 0.9);
    }

    .modal-trigger .text {
      transition: transform 0.5s ease;
    }

    .modal-trigger:hover .text {
      transform: translateX(160px);
    }

    .modal-trigger .icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateX(-160px);
      transition: transform 0.5s ease;
      font-size: 1.25rem;
      z-index: 20;
    }

    .modal-trigger:hover .icon {
      transform: translateX(0);
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      perspective: 800px;
      transform-style: preserve-3d;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-backdrop.closing {
      opacity: 0;
    }

    /* Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      height: 100%;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(0px);
      z-index: 50;
      transition: backdrop-filter 0.3s ease;
    }

    .modal-backdrop.open .modal-overlay {
      backdrop-filter: blur(10px);
    }

    .modal-backdrop.closing .modal-overlay {
      backdrop-filter: blur(0px);
    }

    /* Modal Container */
    .modal-container {
      position: relative;
      z-index: 51;
      min-height: 50%;
      max-height: 90%;
      width: 100%;
      max-width: 100%;
      background-color: #0a0a0a;
      border: 1px solid #262626;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      transform-style: preserve-3d;
      /* Initial state */
      opacity: 0;
      transform: scale(0.5) rotateX(40deg) translateY(40px);
    }

    @media (min-width: 768px) {
      .modal-container {
        max-width: 40%;
        border-radius: 1rem;
      }
    }

    .modal-backdrop.open .modal-container {
      animation: modalEnter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .modal-backdrop.closing .modal-container {
      animation: modalExit 0.3s ease forwards;
    }

    @keyframes modalEnter {
      0% {
        opacity: 0;
        transform: scale(0.5) rotateX(40deg) translateY(40px);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotateX(0deg) translateY(0px);
      }
    }

    @keyframes modalExit {
      0% {
        opacity: 1;
        transform: scale(1) rotateX(0deg) translateY(0px);
      }
      100% {
        opacity: 0;
        transform: scale(0.8) rotateX(10deg) translateY(0px);
      }
    }

    /* Close Button */
    .close-button {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.25rem;
      z-index: 60;
    }

    .close-button svg {
      width: 1rem;
      height: 1rem;
      color: #fff;
      transition: transform 0.2s ease;
    }

    .close-button:hover svg {
      transform: scale(1.25) rotate(3deg);
    }

    /* Modal Content */
    .modal-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    @media (min-width: 768px) {
      .modal-content {
        padding: 2.5rem;
      }
    }

    /* Modal Footer */
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      padding: 1rem;
      background-color: #171717;
    }

    /* Title */
    .modal-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: #f5f5f5;
      text-align: center;
      margin-bottom: 2rem;
    }

    @media (min-width: 768px) {
      .modal-title {
        font-size: 1.5rem;
      }
    }

    .modal-title .highlight {
      display: inline-block;
      padding: 0.125rem 0.25rem;
      border-radius: 0.375rem;
      background-color: #262626;
      border: 1px solid #404040;
    }

    /* Image Gallery */
    .image-gallery {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image-card {
      border-radius: 0.75rem;
      margin-right: -1rem;
      margin-top: 1rem;
      padding: 0.25rem;
      background-color: #262626;
      border: 1px solid #404040;
      flex-shrink: 0;
      overflow: hidden;
      transition: transform 0.3s ease, z-index 0s;
      cursor: pointer;
    }

    .image-card:hover {
      transform: scale(1.1) rotate(0deg) !important;
      z-index: 100;
    }

    .image-card img {
      border-radius: 0.5rem;
      width: 5rem;
      height: 5rem;
      object-fit: cover;
      flex-shrink: 0;
    }

    @media (min-width: 768px) {
      .image-card img {
        width: 10rem;
        height: 10rem;
      }
    }

    /* Features List */
    .features-list {
      padding: 2.5rem 0;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      align-items: flex-start;
      justify-content: flex-start;
      max-width: 24rem;
      margin: 0 auto;
    }

    .feature-item {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feature-item svg {
      margin-right: 0.25rem;
      width: 1rem;
      height: 1rem;
      color: #d4d4d4;
    }

    .feature-item span {
      font-size: 0.875rem;
      color: #d4d4d4;
    }

    /* Footer Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      width: 7rem;
      transition: background-color 0.2s ease;
    }

    .btn-secondary {
      background-color: #262626;
      color: #fff;
      border: 1px solid #404040;
    }

    .btn-secondary:hover {
      background-color: #333;
    }

    .btn-primary {
      background-color: #fff;
      color: #000;
      border: 1px solid #fff;
    }

    .btn-primary:hover {
      background-color: #e5e5e5;
    }

    /* Light Mode */
    @media (prefers-color-scheme: light) {
      body {
        background-color: #f5f5f5;
      }

      .modal-trigger {
        background-color: #000;
        color: #fff;
      }

      .modal-container {
        background-color: #fff;
        border-color: #e5e5e5;
      }

      .close-button svg {
        color: #000;
      }

      .modal-title {
        color: #525252;
      }

      .modal-title .highlight {
        background-color: #f5f5f5;
        border-color: #e5e5e5;
      }

      .image-card {
        background-color: #fff;
        border-color: #f5f5f5;
      }

      .feature-item svg,
      .feature-item span {
        color: #525252;
      }

      .modal-footer {
        background-color: #f5f5f5;
      }

      .btn-secondary {
        background-color: #e5e5e5;
        color: #000;
        border-color: #d4d4d4;
      }

      .btn-primary {
        background-color: #000;
        color: #fff;
        border-color: #000;
      }
    }
  </style>
</head>
<body>
  <!-- Trigger Button -->
  <button class="modal-trigger" id="modalTrigger">
    <span class="text">Book your flight</span>
    <span class="icon">✈️</span>
  </button>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <!-- Overlay -->
    <div class="modal-overlay" id="modalOverlay"></div>
    
    <!-- Modal Container -->
    <div class="modal-container" id="modalContainer">
      <!-- Close Button -->
      <button class="close-button" id="closeButton">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
          <path d="M18 6l-12 12"/>
          <path d="M6 6l12 12"/>
        </svg>
      </button>

      <!-- Content -->
      <div class="modal-content">
        <h4 class="modal-title">
          Book your trip to 
          <span class="highlight">Bali</span> 
          now! ✈️
        </h4>

        <!-- Image Gallery -->
        <div class="image-gallery" id="imageGallery">
          <!-- Images will be inserted by JavaScript -->
        </div>

        <!-- Features -->
        <div class="features-list">
          <div class="feature-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <path d="M16 10h4a2 2 0 0 1 0 4h-4l-4 7h-3l2 -7h-4l-2 2h-3l2 -4l-2 -4h3l2 2h4l-2 -7h3z"/>
            </svg>
            <span>5 connecting flights</span>
          </div>
          <div class="feature-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <path d="M5 4m0 1a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1z"/>
              <path d="M10 10l2 -2l2 2"/>
              <path d="M10 14l2 2l2 -2"/>
            </svg>
            <span>12 hotels</span>
          </div>
          <div class="feature-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <path d="M17.553 16.75a7.5 7.5 0 0 0 -10.606 0"/>
              <path d="M18 3.804a6 6 0 0 0 -8.196 2.196l10.392 6a6 6 0 0 0 -2.196 -8.196z"/>
              <path d="M16.732 10c1.658 -2.87 2.225 -5.644 1.268 -6.196c-.957 -.552 -3.075 1.326 -4.732 4.196"/>
              <path d="M15 9l-3 5.196"/>
              <path d="M3 19.25a2.4 2.4 0 0 1 1 -.25a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 2 1a2.4 2.4 0 0 0 2 1a2.4 2.4 0 0 0 2 -1a2.4 2.4 0 0 1 2 -1a2.4 2.4 0 0 1 1 .25"/>
            </svg>
            <span>69 visiting spots</span>
          </div>
          <div class="feature-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <path d="M20 20c0 -3.952 -.966 -16 -4.038 -16s-3.962 9.087 -3.962 14.756c0 -5.669 -.896 -14.756 -3.962 -14.756c-3.065 0 -4.038 12.048 -4.038 16"/>
            </svg>
            <span>Good food everyday</span>
          </div>
          <div class="feature-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <path d="M15 12.9a5 5 0 1 0 -3.902 -3.9"/>
              <path d="M15 12.9l-3.902 -3.899l-7.513 8.584a2 2 0 1 0 2.827 2.83l8.588 -7.515z"/>
            </svg>
            <span>Open Mic</span>
          </div>
          <div class="feature-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <path d="M22 12a10 10 0 1 0 -20 0"/>
              <path d="M22 12c0 -1.66 -1.46 -3 -3.25 -3c-1.8 0 -3.25 1.34 -3.25 3c0 -1.66 -1.57 -3 -3.5 -3s-3.5 1.34 -3.5 3c0 -1.66 -1.46 -3 -3.25 -3c-1.8 0 -3.25 1.34 -3.25 3"/>
              <path d="M2 12l10 10l-3.5 -10"/>
              <path d="M15.5 12l-3.5 10l10 -10"/>
            </svg>
            <span>Paragliding</span>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelButton">Cancel</button>
        <button class="btn btn-primary" id="bookButton">Book Now</button>
      </div>
    </div>
  </div>

  <script>
    // Image data
    const images = [
      "https://images.unsplash.com/photo-1517322048670-4fba75cbbb62?w=400&h=400&fit=crop",
      "https://images.unsplash.com/photo-1573790387438-4da905039392?w=400&h=400&fit=crop",
      "https://images.unsplash.com/photo-1555400038-63f5ba517a47?w=400&h=400&fit=crop",
      "https://images.unsplash.com/photo-1554931670-4ebfabf6e7a9?w=400&h=400&fit=crop",
      "https://images.unsplash.com/photo-1546484475-7f7bd55792da?w=400&h=400&fit=crop",
    ];

    // Seed random for consistent rotation
    function seededRandom(seed) {
      const x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    }

    // Create image gallery
    const imageGallery = document.getElementById('imageGallery');
    
    images.forEach((src, idx) => {
      const rotation = seededRandom(idx * 12345) * 20 - 10; // -10 to 10 degrees
      
      const card = document.createElement('div');
      card.className = 'image-card';
      card.style.transform = `rotate(${rotation}deg)`;
      card.dataset.rotation = rotation;
      
      const img = document.createElement('img');
      img.src = src;
      img.alt = `Bali image ${idx + 1}`;
      img.loading = 'lazy';
      
      card.appendChild(img);
      imageGallery.appendChild(card);

      // Hover handlers to reset rotation
      card.addEventListener('mouseenter', () => {
        card.style.transform = 'scale(1.1) rotate(0deg)';
        card.style.zIndex = '100';
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = `rotate(${rotation}deg)`;
        card.style.zIndex = '';
      });
    });

    // Modal State
    let isOpen = false;
    let isAnimating = false;

    // DOM Elements
    const modalTrigger = document.getElementById('modalTrigger');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalContainer = document.getElementById('modalContainer');
    const modalOverlay = document.getElementById('modalOverlay');
    const closeButton = document.getElementById('closeButton');
    const cancelButton = document.getElementById('cancelButton');
    const bookButton = document.getElementById('bookButton');

    // Open Modal
    function openModal() {
      if (isAnimating) return;
      isAnimating = true;
      isOpen = true;
      
      document.body.style.overflow = 'hidden';
      modalBackdrop.classList.remove('closing');
      modalBackdrop.classList.add('open');

      // Reset animation
      modalContainer.style.animation = 'none';
      modalContainer.offsetHeight; // Trigger reflow
      modalContainer.style.animation = '';

      setTimeout(() => {
        isAnimating = false;
      }, 600);
    }

    // Close Modal
    function closeModal() {
      if (isAnimating || !isOpen) return;
      isAnimating = true;
      
      modalBackdrop.classList.add('closing');

      setTimeout(() => {
        modalBackdrop.classList.remove('open', 'closing');
        document.body.style.overflow = 'auto';
        isOpen = false;
        isAnimating = false;
      }, 300);
    }

    // Event Listeners
    modalTrigger.addEventListener('click', openModal);
    closeButton.addEventListener('click', closeModal);
    cancelButton.addEventListener('click', closeModal);
    
    bookButton.addEventListener('click', () => {
      alert('Booking confirmed! 🎉');
      closeModal();
    });

    // Outside Click Detection
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop || e.target === modalOverlay) {
        closeModal();
      }
    });

    // Escape Key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isOpen) {
        closeModal();
      }
    });
  </script>
</body>
</html>
