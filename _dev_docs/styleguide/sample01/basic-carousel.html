<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Carousel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* Carousel Container */
    .carousel {
      max-width: 28rem;
      width: 100%;
      margin: 0 auto;
    }

    /* Control Buttons */
    .carousel-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .carousel-btn {
      padding: 0.5rem 1rem;
      background-color: #1f2937;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .carousel-btn:hover {
      background-color: #374151;
    }

    .carousel-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Item Group (Viewport) */
    .carousel-viewport {
      overflow: hidden;
      border-radius: 0.5rem;
    }

    /* Item Track */
    .carousel-track {
      display: flex;
      transition: transform 0.3s ease-out;
    }

    /* Item */
    .carousel-item {
      flex: 0 0 100%;
      min-width: 100%;
    }

    .carousel-item img {
      width: 100%;
      height: 16rem;
      object-fit: cover;
      display: block;
    }

    /* Indicators */
    .carousel-indicators {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 1rem;
      gap: 0.5rem;
    }

    .carousel-indicator {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background-color: #4b5563;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .carousel-indicator:hover {
      background-color: #6b7280;
    }

    .carousel-indicator[data-current="true"] {
      background-color: #3b82f6;
    }

    /* Light Mode */
    @media (prefers-color-scheme: light) {
      body {
        background-color: #f5f5f5;
      }

      .carousel-btn {
        background-color: #f3f4f6;
        color: #111827;
      }

      .carousel-btn:hover {
        background-color: #e5e7eb;
      }

      .carousel-indicator {
        background-color: #d1d5db;
      }

      .carousel-indicator:hover {
        background-color: #9ca3af;
      }

      .carousel-indicator[data-current="true"] {
        background-color: #3b82f6;
      }
    }
  </style>
</head>
<body>
  <div class="carousel" id="carousel">
    <!-- Control Buttons -->
    <div class="carousel-control">
      <button class="carousel-btn" id="prevBtn">Previous</button>
      <button class="carousel-btn" id="nextBtn">Next</button>
    </div>

    <!-- Viewport -->
    <div class="carousel-viewport">
      <div class="carousel-track" id="carouselTrack">
        <!-- Items will be inserted by JavaScript -->
      </div>
    </div>

    <!-- Indicators -->
    <div class="carousel-indicators" id="carouselIndicators">
      <!-- Indicators will be inserted by JavaScript -->
    </div>
  </div>

  <script>
    // Configuration
    const slideCount = 5;
    let currentPage = 0;

    // Generate image URLs
    const images = Array.from(
      { length: slideCount },
      (_, i) => `https://picsum.photos/seed/${i + 1}/500/300`
    );

    // DOM Elements
    const track = document.getElementById('carouselTrack');
    const indicators = document.getElementById('carouselIndicators');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // Create carousel items
    images.forEach((image, index) => {
      const item = document.createElement('div');
      item.className = 'carousel-item';
      item.innerHTML = `
        <img src="${image}" alt="Slide ${index + 1}" loading="lazy">
      `;
      track.appendChild(item);
    });

    // Create indicators
    images.forEach((_, index) => {
      const indicator = document.createElement('button');
      indicator.className = 'carousel-indicator';
      indicator.setAttribute('aria-label', `Go to slide ${index + 1}`);
      indicator.dataset.index = index;
      if (index === 0) {
        indicator.dataset.current = 'true';
      }
      indicators.appendChild(indicator);
    });

    // Update carousel position
    function goToPage(page) {
      // Clamp page value
      currentPage = Math.max(0, Math.min(slideCount - 1, page));

      // Update track position
      track.style.transform = `translateX(-${currentPage * 100}%)`;

      // Update indicators
      const allIndicators = indicators.querySelectorAll('.carousel-indicator');
      allIndicators.forEach((ind, index) => {
        ind.dataset.current = index === currentPage ? 'true' : 'false';
      });

      // Update button states (optional: disable at bounds)
      // prevBtn.disabled = currentPage === 0;
      // nextBtn.disabled = currentPage === slideCount - 1;
    }

    // Event Listeners
    prevBtn.addEventListener('click', () => {
      goToPage(currentPage - 1);
    });

    nextBtn.addEventListener('click', () => {
      goToPage(currentPage + 1);
    });

    // Indicator clicks
    indicators.addEventListener('click', (e) => {
      if (e.target.classList.contains('carousel-indicator')) {
        const index = parseInt(e.target.dataset.index);
        goToPage(index);
      }
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        goToPage(currentPage - 1);
      } else if (e.key === 'ArrowRight') {
        goToPage(currentPage + 1);
      }
    });

    // Optional: Touch/Swipe support
    let touchStartX = 0;
    let touchEndX = 0;

    const viewport = document.querySelector('.carousel-viewport');

    viewport.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    viewport.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeThreshold = 50;
      const diff = touchStartX - touchEndX;

      if (diff > swipeThreshold) {
        // Swipe left - next
        goToPage(currentPage + 1);
      } else if (diff < -swipeThreshold) {
        // Swipe right - prev
        goToPage(currentPage - 1);
      }
    }

    // Initialize
    goToPage(0);
  </script>
</body>
</html>
