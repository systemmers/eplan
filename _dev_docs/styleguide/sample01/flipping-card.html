<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipping Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* Container */
    .cards-container {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      padding: 2rem;
    }

    /* Flipping Card Wrapper - perspective 컨테이너 */
    .flipping-card-wrapper {
      perspective: 1000px;
    }

    /* Flipping Card - 회전하는 카드 본체 */
    .flipping-card {
      position: relative;
      border-radius: 0.75rem;
      border: 1px solid #262626;
      background-color: #0a0a0a;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 
                  0 4px 6px -2px rgba(0, 0, 0, 0.05);
      transition: transform 0.7s ease;
      transform-style: preserve-3d;
    }

    .flipping-card-wrapper:hover .flipping-card {
      transform: rotateY(180deg);
    }

    /* Card Face - 앞/뒷면 공통 */
    .card-face {
      position: absolute;
      inset: 0;
      height: 100%;
      width: 100%;
      border-radius: inherit;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background-color: #09090b;
      color: #fafafa;
      overflow: hidden;
      /* 핵심: 3D 컨텍스트 유지 */
      transform-style: preserve-3d;
    }

    /* Front Face */
    .card-front {
      transform: rotateY(0deg);
    }

    /* Back Face */
    .card-back {
      transform: rotateY(180deg);
    }

    /* 3D Depth Content - 깊이감의 핵심 */
    .card-content {
      height: 100%;
      width: 100%;
      /* 핵심: translateZ로 내용물을 앞으로 튀어나오게 */
      transform: translateZ(70px) scale(0.93);
      /* 3D 컨텍스트 유지 */
      transform-style: preserve-3d;
    }

    /* Front Content Styles */
    .front-content {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      padding: 1rem;
    }

    .front-content img {
      width: 100%;
      height: auto;
      object-fit: cover;
      flex-grow: 1;
      min-height: 0;
      border-radius: 0.375rem;
    }

    .front-content .text-container {
      padding: 0.5rem;
    }

    .front-content h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 0.5rem;
      color: #fafafa;
    }

    .front-content p {
      font-size: 0.84375rem;
      margin-top: 0.5rem;
      color: #a1a1aa;
      line-height: 1.5;
    }

    /* Back Content Styles */
    .back-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
      padding: 1.5rem;
    }

    .back-content p {
      font-size: 0.84375rem;
      margin-top: 0.5rem;
      color: #a1a1aa;
      text-align: center;
      line-height: 1.6;
    }

    .back-content button {
      margin-top: 1.5rem;
      background-color: #fafafa;
      color: #09090b;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-size: 0.84375rem;
      white-space: nowrap;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s, transform 0.1s;
    }

    .back-content button:hover {
      background-color: #e4e4e7;
    }

    .back-content button:active {
      transform: scale(0.98);
    }

    /* Light Mode */
    @media (prefers-color-scheme: light) {
      body {
        background-color: #f5f5f5;
      }

      .flipping-card {
        border-color: #e5e5e5;
        background-color: #ffffff;
      }

      .card-face {
        background-color: #ffffff;
        color: #0a0a0a;
      }

      .front-content h3 {
        color: #0a0a0a;
      }

      .front-content p,
      .back-content p {
        color: #737373;
      }

      .back-content button {
        background-color: #0a0a0a;
        color: #fafafa;
      }

      .back-content button:hover {
        background-color: #262626;
      }
    }
  </style>
</head>
<body>
  <div class="cards-container" id="cardsContainer">
    <!-- Cards will be inserted here by JavaScript -->
  </div>

  <script>
    // Card Data
    const cardsData = [
      {
        id: "design-excellence",
        front: {
          imageSrc: "https://images.unsplash.com/photo-1561070791-2526d30994b5?w=400&h=300&fit=crop",
          imageAlt: "Design Excellence",
          title: "Design Excellence",
          description: "Beautiful, intuitive designs that create meaningful connections with users.",
        },
        back: {
          description: "We craft exceptional user experiences through thoughtful design, user research, and modern design systems that ensure consistency and accessibility.",
          buttonText: "View Portfolio",
        },
      },
      {
        id: "data-analytics",
        front: {
          imageSrc: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=400&h=300&fit=crop",
          imageAlt: "Data Analytics",
          title: "Data Analytics",
          description: "Transform raw data into actionable insights that drive informed decision-making.",
        },
        back: {
          description: "Our data analytics platform provides real-time insights, predictive modeling, and interactive dashboards to help businesses make data-driven decisions.",
          buttonText: "Learn More",
        },
      },
      {
        id: "cloud-solutions",
        front: {
          imageSrc: "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=400&h=300&fit=crop",
          imageAlt: "Cloud Solutions",
          title: "Cloud Solutions",
          description: "Scalable, secure cloud infrastructure for modern applications.",
        },
        back: {
          description: "Deploy your applications on our enterprise-grade cloud platform with auto-scaling, high availability, and advanced security features built-in.",
          buttonText: "Get Started",
        },
      },
    ];

    // Create Flipping Card HTML
    function createFlippingCard(card, width = 300, height = 300) {
      return `
        <div class="flipping-card-wrapper">
          <div class="flipping-card" style="width: ${width}px; height: ${height}px;">
            <!-- Front Face -->
            <div class="card-face card-front">
              <div class="card-content">
                <div class="front-content">
                  <img src="${card.front.imageSrc}" alt="${card.front.imageAlt}" loading="lazy">
                  <div class="text-container">
                    <h3>${card.front.title}</h3>
                    <p>${card.front.description}</p>
                  </div>
                </div>
              </div>
            </div>
            <!-- Back Face -->
            <div class="card-face card-back">
              <div class="card-content">
                <div class="back-content">
                  <p>${card.back.description}</p>
                  <button onclick="handleButtonClick('${card.id}')">${card.back.buttonText}</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Initialize cards
    const container = document.getElementById('cardsContainer');
    
    cardsData.forEach(card => {
      container.insertAdjacentHTML('beforeend', createFlippingCard(card, 300, 300));
    });

    // Button click handler
    function handleButtonClick(cardId) {
      console.log(`Button clicked for card: ${cardId}`);
      alert(`Action triggered for: ${cardId}`);
    }
  </script>
</body>
</html>
