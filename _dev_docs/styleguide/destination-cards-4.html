<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Offices - 글로벌 지점 안내</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* 커스텀 CSS - DestinationCard 컴포넌트 스타일 */
        .destination-card {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.5s ease-in-out;
        }

        .destination-card:hover {
            transform: scale(1.05);
        }

        .card-background {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease-in-out;
        }

        .destination-card:hover .card-background {
            transform: scale(1.1);
        }

        .card-overlay {
            position: absolute;
            inset: 0;
        }

        .card-content {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            padding: 1.5rem;
            color: white;
        }

        .card-title {
            font-size: 1.875rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .card-stats {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 0.25rem;
            font-weight: 500;
        }

        .card-button {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
            border-width: 1px;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            transition: all 0.3s;
        }

        .card-button-text {
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.025em;
        }

        .card-arrow {
            width: 1rem;
            height: 1rem;
            transition: transform 0.3s;
        }

        .destination-card:hover .card-arrow {
            transform: translateX(0.25rem);
        }

        /* 테마별 스타일 */
        .theme-green {
            box-shadow: 0 0 40px -15px hsl(150 50% 25% / 0.5);
        }

        .theme-green:hover {
            box-shadow: 0 0 60px -15px hsl(150 50% 25% / 0.6);
        }

        .theme-purple {
            box-shadow: 0 0 40px -15px hsl(250 50% 30% / 0.5);
        }

        .theme-purple:hover {
            box-shadow: 0 0 60px -15px hsl(250 50% 30% / 0.6);
        }

        .theme-pink {
            box-shadow: 0 0 40px -15px hsl(350 60% 35% / 0.5);
        }

        .theme-pink:hover {
            box-shadow: 0 0 60px -15px hsl(350 60% 35% / 0.6);
        }

        .theme-blue {
            box-shadow: 0 0 40px -15px hsl(210 55% 30% / 0.5);
        }

        .theme-blue:hover {
            box-shadow: 0 0 60px -15px hsl(210 55% 30% / 0.6);
        }

        /* 월드맵 배경 스타일 */
        .world-map-background {
            background-image: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        .world-map-background::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(249, 250, 251, 0.95), rgba(249, 250, 251, 0.85));
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">

    <!-- 사용 가이드 주석 -->
    <!--
    ========================================
    📋 Global Offices - 사용 가이드
    ========================================

    ## 카드 커스터마이징

    각 카드는 다음 요소들로 구성됩니다:

    1. **배경 이미지**: .card-background의 background-image 속성
    2. **테마 색상**: HSL 값으로 정의 (그라디언트, 그림자)
    3. **제목**: 도시 이름 + 국기 이모지
    4. **통계**: 국가명 지점 • 직원 수

    ## 테마 색상 변경

    각 카드의 테마 색상은 HSL 형식으로 정의됩니다:
    - Toronto: hsl(150 50% 25%) - 깊은 그린
    - Manila: hsl(250 50% 30%) - 트와일라잇 퍼플
    - Tokyo: hsl(350 60% 35%) - 핑크/레드
    - Shanghai: hsl(210 55% 30%) - 딥 블루

    ## 월드맵 배경

    섹션 배경에 월드맵 이미지가 적용되어 있으며, 반투명 오버레이로 카드가 잘 보이도록 처리되어 있습니다.
    배경 이미지는 .world-map-background 클래스에서 변경할 수 있습니다.

    ## 반응형 동작

    - 모바일 (< 768px): 1열 스택
    - 태블릿 (>= 768px): 2열 그리드
    - 데스크톱 (>= 1024px): 4열 그리드 (4x1)

    ## 새 지점 카드 추가 방법

    1. 위의 카드 구조를 복사
    2. 테마 클래스 변경 (theme-green, theme-purple 등)
    3. 배경 이미지 URL 변경
    4. 그라디언트 오버레이의 HSL 값 변경
    5. 제목, 지점 정보, aria-label 업데이트
    6. 버튼의 배경/테두리 색상 HSL 값 변경

    ========================================
    -->
