<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate - Process Timeline</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .timeline-step {
            transition: all 0.3s ease;
        }
        .timeline-step:hover {
            transform: translateY(-5px);
        }
        .timeline-step:hover .step-icon {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(0,99,92,0.3);
        }
    </style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    CORPORATE - SECTION 09: Process Timeline
    - 도입 프로세스 타임라인
    - 단계별 절차 안내
    - 시각적 흐름 표현
-->
<section style="
    position: relative;
    min-height: 100vh;
    background: linear-gradient(180deg, #00635C 0%, #004d47 100%);
    color: white;
    padding: 4rem 2rem;
">
    <!-- Section Header -->
    <div style="text-align: center; margin-bottom: 4rem;">
        <span style="
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        ">PROCESS</span>
        <h2 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            font-weight: 700;
            margin: 0 0 1rem;
        ">기업교육 <span style="color: #FFB74D;">도입 절차</span></h2>
        <p style="
            font-size: 1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        ">간편한 5단계 프로세스로 기업 맞춤 교육을 시작하세요</p>
    </div>

    <!-- Timeline -->
    <div style="max-width: 1000px; margin: 0 auto; position: relative;">
        <!-- Timeline Line -->
        <div style="
            position: absolute;
            top: 50px;
            left: 10%;
            right: 10%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        "></div>
        <div style="
            position: absolute;
            top: 50px;
            left: 10%;
            width: 20%;
            height: 4px;
            background: #FFB74D;
            border-radius: 2px;
        "></div>

        <!-- Timeline Steps -->
        <div style="
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            position: relative;
        ">
            <!-- Step 1 -->
            <div class="timeline-step" style="text-align: center;">
                <div class="step-icon" style="
                    width: 100px;
                    height: 100px;
                    background: linear-gradient(135deg, #FFB74D, #FFA726);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    margin: 0 auto 1.5rem;
                    position: relative;
                    z-index: 10;
                    transition: all 0.3s ease;
                ">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </div>
                <div style="
                    font-family: 'Poppins', sans-serif;
                    font-size: 0.75rem;
                    font-weight: 700;
                    color: #FFB74D;
                    margin-bottom: 0.5rem;
                ">STEP 01</div>
                <h4 style="font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 600; margin: 0 0 0.5rem;">상담 문의</h4>
                <p style="font-size: 0.8rem; opacity: 0.8; line-height: 1.5; margin: 0;">전화 또는 온라인으로<br>상담 요청</p>
            </div>

            <!-- Step 2 -->
            <div class="timeline-step" style="text-align: center;">
                <div class="step-icon" style="
                    width: 100px;
                    height: 100px;
                    background: rgba(255,255,255,0.2);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    margin: 0 auto 1.5rem;
                    position: relative;
                    z-index: 10;
                    transition: all 0.3s ease;
                ">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                </div>
                <div style="
                    font-family: 'Poppins', sans-serif;
                    font-size: 0.75rem;
                    font-weight: 700;
                    opacity: 0.7;
                    margin-bottom: 0.5rem;
                ">STEP 02</div>
                <h4 style="font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 600; margin: 0 0 0.5rem;">니즈 분석</h4>
                <p style="font-size: 0.8rem; opacity: 0.8; line-height: 1.5; margin: 0;">기업 환경 및<br>교육 목표 파악</p>
            </div>

            <!-- Step 3 -->
            <div class="timeline-step" style="text-align: center;">
                <div class="step-icon" style="
                    width: 100px;
                    height: 100px;
                    background: rgba(255,255,255,0.2);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    margin: 0 auto 1.5rem;
                    position: relative;
                    z-index: 10;
                    transition: all 0.3s ease;
                ">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                    </svg>
                </div>
                <div style="
                    font-family: 'Poppins', sans-serif;
                    font-size: 0.75rem;
                    font-weight: 700;
                    opacity: 0.7;
                    margin-bottom: 0.5rem;
                ">STEP 03</div>
                <h4 style="font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 600; margin: 0 0 0.5rem;">커리큘럼 설계</h4>
                <p style="font-size: 0.8rem; opacity: 0.8; line-height: 1.5; margin: 0;">맞춤형 교육<br>프로그램 설계</p>
            </div>

            <!-- Step 4 -->
            <div class="timeline-step" style="text-align: center;">
                <div class="step-icon" style="
                    width: 100px;
                    height: 100px;
                    background: rgba(255,255,255,0.2);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    margin: 0 auto 1.5rem;
                    position: relative;
                    z-index: 10;
                    transition: all 0.3s ease;
                ">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div style="
                    font-family: 'Poppins', sans-serif;
                    font-size: 0.75rem;
                    font-weight: 700;
                    opacity: 0.7;
                    margin-bottom: 0.5rem;
                ">STEP 04</div>
                <h4 style="font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 600; margin: 0 0 0.5rem;">강사 배정</h4>
                <p style="font-size: 0.8rem; opacity: 0.8; line-height: 1.5; margin: 0;">최적의 전문<br>강사 매칭</p>
            </div>

            <!-- Step 5 -->
            <div class="timeline-step" style="text-align: center;">
                <div class="step-icon" style="
                    width: 100px;
                    height: 100px;
                    background: rgba(255,255,255,0.2);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    margin: 0 auto 1.5rem;
                    position: relative;
                    z-index: 10;
                    transition: all 0.3s ease;
                ">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </div>
                <div style="
                    font-family: 'Poppins', sans-serif;
                    font-size: 0.75rem;
                    font-weight: 700;
                    opacity: 0.7;
                    margin-bottom: 0.5rem;
                ">STEP 05</div>
                <h4 style="font-family: 'Poppins', sans-serif; font-size: 1rem; font-weight: 600; margin: 0 0 0.5rem;">교육 시작</h4>
                <p style="font-size: 0.8rem; opacity: 0.8; line-height: 1.5; margin: 0;">본 교육 진행 및<br>지속적 모니터링</p>
            </div>
        </div>
    </div>

    <!-- Timeline Info -->
    <div style="
        max-width: 800px;
        margin: 4rem auto 0;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2rem;
        text-align: center;
    ">
        <div style="
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 1.5rem;
        ">
            <div style="font-family: 'Poppins', sans-serif; font-size: 2rem; font-weight: 700; color: #FFB74D;">1주일</div>
            <div style="font-size: 0.875rem; opacity: 0.8;">상담~계약 완료</div>
        </div>
        <div style="
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 1.5rem;
        ">
            <div style="font-family: 'Poppins', sans-serif; font-size: 2rem; font-weight: 700; color: #FFB74D;">2주</div>
            <div style="font-size: 0.875rem; opacity: 0.8;">커리큘럼 설계</div>
        </div>
        <div style="
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 1.5rem;
        ">
            <div style="font-family: 'Poppins', sans-serif; font-size: 2rem; font-weight: 700; color: #FFB74D;">3주</div>
            <div style="font-size: 0.875rem; opacity: 0.8;">교육 시작까지</div>
        </div>
    </div>
</section>
</body>
</html>
