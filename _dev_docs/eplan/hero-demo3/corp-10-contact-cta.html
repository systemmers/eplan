<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate - Contact CTA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .cta-btn {
            transition: all 0.3s ease;
        }
        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255,183,77,0.4);
        }
        .contact-card {
            transition: all 0.3s ease;
        }
        .contact-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.15) !important;
        }
    </style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    CORPORATE - SECTION 10: Contact CTA
    - 기업 상담 문의 CTA
    - 연락처 및 폼
    - 강조 디자인
-->
<section style="
    position: relative;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f1a 100%);
    color: white;
    padding: 4rem 2rem;
    display: flex;
    align-items: center;
">
    <!-- Background Pattern -->
    <div style="
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
            radial-gradient(circle at 30% 70%, rgba(0,99,92,0.3) 0%, transparent 50%),
            radial-gradient(circle at 70% 30%, rgba(255,183,77,0.2) 0%, transparent 50%);
        pointer-events: none;
    "></div>

    <div style="max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; width: 100%;">
        <!-- Main Content -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center;">
            <!-- Left: Text Content -->
            <div>
                <span style="
                    display: inline-block;
                    background: linear-gradient(135deg, #00635C, #63A19B);
                    color: white;
                    padding: 0.5rem 1.5rem;
                    border-radius: 50px;
                    font-size: 0.875rem;
                    font-weight: 600;
                    margin-bottom: 1.5rem;
                ">CONTACT US</span>
                <h2 style="
                    font-family: 'Poppins', sans-serif;
                    font-size: clamp(2rem, 5vw, 3rem);
                    font-weight: 700;
                    margin: 0 0 1rem;
                    line-height: 1.2;
                ">기업 영어교육<br><span style="color: #FFB74D;">전문 상담</span> 받기</h2>
                <p style="
                    font-size: 1.1rem;
                    opacity: 0.9;
                    line-height: 1.7;
                    margin: 0 0 2rem;
                ">15년 기업교육 노하우로 최적의 영어 교육 솔루션을 제안해 드립니다. 지금 바로 무료 상담을 신청하세요.</p>

                <!-- Contact Options -->
                <div style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
                    <div class="contact-card" style="
                        display: flex;
                        align-items: center;
                        gap: 1rem;
                        background: rgba(255,255,255,0.1);
                        padding: 1rem 1.5rem;
                        border-radius: 12px;
                    ">
                        <div style="
                            width: 48px;
                            height: 48px;
                            background: linear-gradient(135deg, #00635C, #63A19B);
                            border-radius: 12px;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                        ">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                        </div>
                        <div>
                            <div style="font-size: 0.8rem; opacity: 0.7;">전화 상담</div>
                            <div style="font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem;">02-1234-5678</div>
                        </div>
                    </div>
                    <div class="contact-card" style="
                        display: flex;
                        align-items: center;
                        gap: 1rem;
                        background: rgba(255,255,255,0.1);
                        padding: 1rem 1.5rem;
                        border-radius: 12px;
                    ">
                        <div style="
                            width: 48px;
                            height: 48px;
                            background: linear-gradient(135deg, #3b82f6, #2563eb);
                            border-radius: 12px;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                        ">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </div>
                        <div>
                            <div style="font-size: 0.8rem; opacity: 0.7;">이메일 문의</div>
                            <div style="font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.1rem;">corp@eplan.co.kr</div>
                        </div>
                    </div>
                </div>

                <!-- Trust Badges -->
                <div style="display: flex; gap: 2rem; opacity: 0.7;">
                    <div style="text-align: center;">
                        <div style="font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700;">300+</div>
                        <div style="font-size: 0.75rem;">파트너 기업</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700;">15년</div>
                        <div style="font-size: 0.75rem;">기업교육 경력</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700;">95%</div>
                        <div style="font-size: 0.75rem;">재계약률</div>
                    </div>
                </div>
            </div>

            <!-- Right: Form -->
            <div style="
                background: rgba(255,255,255,0.1);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.2);
                border-radius: 24px;
                padding: 2.5rem;
            ">
                <h3 style="font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700; margin: 0 0 1.5rem; text-align: center;">기업 상담 신청</h3>

                <form style="display: flex; flex-direction: column; gap: 1rem;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.5rem;">회사명 *</label>
                            <input type="text" placeholder="(주)ePlan" style="
                                width: 100%;
                                padding: 1rem;
                                background: rgba(255,255,255,0.1);
                                border: 1px solid rgba(255,255,255,0.2);
                                border-radius: 10px;
                                color: white;
                                font-size: 0.95rem;
                                box-sizing: border-box;
                            ">
                        </div>
                        <div>
                            <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.5rem;">담당자명 *</label>
                            <input type="text" placeholder="홍길동" style="
                                width: 100%;
                                padding: 1rem;
                                background: rgba(255,255,255,0.1);
                                border: 1px solid rgba(255,255,255,0.2);
                                border-radius: 10px;
                                color: white;
                                font-size: 0.95rem;
                                box-sizing: border-box;
                            ">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div>
                            <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.5rem;">연락처 *</label>
                            <input type="tel" placeholder="02-1234-5678" style="
                                width: 100%;
                                padding: 1rem;
                                background: rgba(255,255,255,0.1);
                                border: 1px solid rgba(255,255,255,0.2);
                                border-radius: 10px;
                                color: white;
                                font-size: 0.95rem;
                                box-sizing: border-box;
                            ">
                        </div>
                        <div>
                            <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.5rem;">이메일 *</label>
                            <input type="email" placeholder="hr@company.com" style="
                                width: 100%;
                                padding: 1rem;
                                background: rgba(255,255,255,0.1);
                                border: 1px solid rgba(255,255,255,0.2);
                                border-radius: 10px;
                                color: white;
                                font-size: 0.95rem;
                                box-sizing: border-box;
                            ">
                        </div>
                    </div>
                    <div>
                        <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.5rem;">예상 수강 인원</label>
                        <select style="
                            width: 100%;
                            padding: 1rem;
                            background: rgba(255,255,255,0.1);
                            border: 1px solid rgba(255,255,255,0.2);
                            border-radius: 10px;
                            color: white;
                            font-size: 0.95rem;
                            box-sizing: border-box;
                        ">
                            <option value="" style="color: #1a1a1a;">선택해주세요</option>
                            <option value="5-10" style="color: #1a1a1a;">5-10명</option>
                            <option value="11-30" style="color: #1a1a1a;">11-30명</option>
                            <option value="31-50" style="color: #1a1a1a;">31-50명</option>
                            <option value="51+" style="color: #1a1a1a;">51명 이상</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 0.5rem;">문의 내용</label>
                        <textarea placeholder="교육 관련 문의 사항을 입력해주세요" rows="4" style="
                            width: 100%;
                            padding: 1rem;
                            background: rgba(255,255,255,0.1);
                            border: 1px solid rgba(255,255,255,0.2);
                            border-radius: 10px;
                            color: white;
                            font-size: 0.95rem;
                            resize: none;
                            box-sizing: border-box;
                        "></textarea>
                    </div>
                    <button type="submit" class="cta-btn" style="
                        background: linear-gradient(135deg, #FFB74D 0%, #FFA726 100%);
                        color: #1a1a1a;
                        border: none;
                        padding: 1.25rem;
                        border-radius: 12px;
                        font-size: 1.1rem;
                        font-weight: 700;
                        cursor: pointer;
                        margin-top: 0.5rem;
                    ">무료 상담 신청하기</button>
                </form>

                <p style="font-size: 0.75rem; text-align: center; opacity: 0.7; margin: 1rem 0 0;">
                    영업일 기준 24시간 내 담당자가 연락드립니다
                </p>
            </div>
        </div>
    </div>
</section>
</body>
</html>
