<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Style 11: Spotlight - ePlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    STYLE 11: Spotlight Hero
    - 스포트라이트/하이라이트 효과
    - 중앙 집중 조명 느낌
    - 드라마틱한 시각 효과

    적용 대상: 런칭 페이지, 특별 프로모션
    로고: ../../app/static/images/eplan_logo_white.png
-->
<section style="
    position: relative;
    height: 100vh;
    min-height: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    color: white;
    text-align: center;
    padding: 2rem;
    overflow: hidden;
">
    <!-- Spotlight Effect -->
    <div style="
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0, 99, 92, 0.4) 0%, transparent 60%);
        pointer-events: none;
    "></div>
    <div style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(255, 183, 77, 0.15) 0%, transparent 70%);
        pointer-events: none;
    "></div>

    <!-- Content -->
    <div style="
        position: relative;
        z-index: 1;
        max-width: 900px;
    ">
        <!-- Logo -->
        <img src="../../app/static/images/eplan_logo_white.png" alt="ePlan" style="
            height: 60px;
            margin-bottom: 2rem;
        ">
        <p style="
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: #FFB74D;
            margin-bottom: 2rem;
        ">Empowering Global Success</p>

        <h1 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 1.5rem;
            background: linear-gradient(180deg, #ffffff 0%, #63A19B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        ">글로벌 교육의<br>혁신</h1>

        <div style="
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #00635C, #FFB74D);
            margin: 2rem auto;
        "></div>

        <p style="
            font-size: clamp(1.25rem, 2.5vw, 1.75rem);
            color: #999;
            margin-bottom: 1rem;
            line-height: 1.7;
        ">지식 파트너십을 통한<br>글로벌 성공 역량 강화</p>

        <p style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2rem, 5vw, 4rem);
            font-style: italic;
            font-weight: 700;
            color: #00635C;
            margin: 2.5rem 0;
            text-shadow: 0 0 40px rgba(0, 99, 92, 0.5);
        ">Practice Makes Perfect!</p>

        <p style="
            font-size: 1.125rem;
            color: #666;
            letter-spacing: 0.1em;
        ">Your success is just around the corner.</p>
    </div>
</section>
</body>
</html>
