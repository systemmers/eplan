<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Style 22: Video Glass Card - ePlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    STYLE 22: Video Glass Card
    - 비디오 백그라운드 + 글래스모피즘 카드
    - 로고 + 서비스 아이콘
    - 프리미엄 느낌

    적용 대상: 메인 페이지, 프리미엄 서비스
    비디오: ../../app/static/videos/main.mp4
    로고: ../../app/static/images/eplan_logo_white.png, ../../app/static/images/services_logo.png
-->
<section style="
    position: relative;
    height: 100vh;
    min-height: 700px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
">
    <!-- Video Background -->
    <video autoplay muted loop playsinline style="
        position: absolute;
        top: 50%;
        left: 50%;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        transform: translate(-50%, -50%);
        z-index: -2;
        object-fit: cover;
    ">
        <source src="../../app/static/videos/main.mp4" type="video/mp4">
    </video>

    <!-- Overlay -->
    <div style="
        position: absolute;
        inset: 0;
        background: rgba(0, 50, 46, 0.4);
        z-index: -1;
    "></div>

    <!-- Glass Card -->
    <div style="
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        padding: 4rem;
        max-width: 700px;
        text-align: center;
        color: white;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    ">
        <!-- Logo -->
        <img src="../../app/static/images/eplan_logo_white.png" alt="ePlan" style="
            height: 70px;
            margin-bottom: 2rem;
        ">

        <h1 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
        ">글로벌 교육의 혁신</h1>

        <p style="
            font-size: 1.125rem;
            opacity: 0.9;
            margin-bottom: 1.5rem;
            line-height: 1.7;
        ">지식 파트너십을 통한 글로벌 성공 역량 강화</p>

        <div style="
            border-top: 1px solid rgba(255,255,255,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding: 1.5rem 0;
            margin: 1.5rem 0;
        ">
            <p style="
                font-family: 'Poppins', sans-serif;
                font-size: clamp(1.5rem, 3vw, 2.5rem);
                font-style: italic;
                font-weight: 600;
                color: #FFB74D;
                margin: 0;
            ">Practice Makes Perfect!</p>
        </div>

        <p style="
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        ">Your success is just around the corner.</p>

        <!-- Services Logo -->
        <div style="
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        ">
            <img src="../../app/static/images/services_logo.png" alt="Services" style="
                height: 40px;
                opacity: 0.9;
            ">
        </div>

        <button style="
            background: #FFB74D;
            color: #00635C;
            padding: 1rem 3rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        ">무료 상담 신청</button>
    </div>
</section>
</body>
</html>
