<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Style 09: Glassmorphism - ePlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    STYLE 9: Glassmorphism Hero
    - 유리 효과 (블러 + 투명도)
    - 배경 블롭 애니메이션
    - 모던하고 세련된 느낌

    적용 대상: 메인 페이지, 프리미엄 서비스
    로고: ../../app/static/images/eplan_logo_white.png
-->
<style>
    @keyframes blob1 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
    }
    @keyframes blob2 {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(-30px, 30px) scale(0.9); }
        66% { transform: translate(40px, -20px) scale(1.1); }
    }
</style>
<section style="
    position: relative;
    height: 100vh;
    min-height: 700px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    overflow: hidden;
">
    <!-- Animated Blobs -->
    <div style="
        position: absolute;
        top: 20%;
        left: 20%;
        width: 400px;
        height: 400px;
        background: linear-gradient(135deg, #00635C, #63A19B);
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.6;
        animation: blob1 8s ease-in-out infinite;
    "></div>
    <div style="
        position: absolute;
        bottom: 20%;
        right: 20%;
        width: 350px;
        height: 350px;
        background: linear-gradient(135deg, #FFB74D, #FF8A65);
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
        animation: blob2 10s ease-in-out infinite;
    "></div>

    <!-- Glass Card -->
    <div style="
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        padding: 4rem;
        max-width: 800px;
        text-align: center;
        color: white;
    ">
        <!-- Logo -->
        <img src="../../app/static/images/eplan_logo_white.png" alt="ePlan" style="
            height: 60px;
            margin-bottom: 1.5rem;
        ">
        <p style="
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #FFB74D;
            margin-bottom: 1.5rem;
        ">Global Education Innovation</p>

        <h1 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        ">글로벌 교육의 혁신,<br><span style="color: #63A19B;">ePlan</span></h1>

        <p style="
            font-size: 1.25rem;
            opacity: 0.9;
            margin-bottom: 1rem;
            line-height: 1.7;
        ">지식 파트너십을 통한 글로벌 성공 역량 강화</p>

        <p style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-style: italic;
            font-weight: 600;
            color: #FFB74D;
            margin-top: 2rem;
        ">Practice Makes Perfect!</p>

        <div style="margin-top: 2.5rem;">
            <button style="
                background: linear-gradient(135deg, #00635C, #63A19B);
                color: white;
                padding: 1rem 2.5rem;
                border: none;
                border-radius: 50px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                margin-right: 1rem;
            ">무료 상담</button>
            <button style="
                background: transparent;
                color: white;
                padding: 1rem 2.5rem;
                border: 1px solid rgba(255,255,255,0.3);
                border-radius: 50px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
            ">더 알아보기</button>
        </div>
    </div>
</section>
</body>
</html>
