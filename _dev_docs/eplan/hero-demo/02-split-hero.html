<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Style 02: Split Hero - ePlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    STYLE 2: Split Hero (좌우 분할)
    - 왼쪽 텍스트 + 오른쪽 이미지/그래픽
    - 비대칭 레이아웃으로 시각적 흥미 유발
    - CTA 버튼 강조

    적용 대상: 전화영어, 서비스 랜딩 페이지
-->
<section style="
    position: relative;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: #FAFAFA;
">
    <!-- Left: Content -->
    <div style="
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 4rem;
        background: white;
    ">
        <span style="
            display: inline-block;
            background: #FFB74D;
            color: #00635C;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            width: fit-content;
        ">Global Education</span>
        <h1 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 800;
            color: #263238;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        ">Transform Your<br><span style="color: #00635C;">English Skills</span></h1>
        <p style="
            font-size: 1.125rem;
            color: #90A4AE;
            line-height: 1.8;
            margin-bottom: 2rem;
            max-width: 500px;
        ">1:1 맞춤형 전화영어로 실력을 향상시키세요.
        글로벌 인재로 성장하는 첫 걸음을 ePlan과 함께하세요.</p>
        <div style="display: flex; gap: 1rem;">
            <button style="
                background: #00635C;
                color: white;
                padding: 1rem 2rem;
                border: none;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
            ">무료 상담 신청</button>
            <button style="
                background: transparent;
                color: #00635C;
                padding: 1rem 2rem;
                border: 2px solid #00635C;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
            ">프로그램 보기</button>
        </div>
    </div>
    <!-- Right: Visual -->
    <div style="
        background: linear-gradient(135deg, #00635C 0%, #63A19B 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
    ">
        <div style="
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        ">
            <span style="
                font-family: 'Poppins', sans-serif;
                font-size: 4rem;
                font-weight: 800;
                color: white;
                opacity: 0.9;
            ">ePlan</span>
        </div>
        <!-- Decorative circles -->
        <div style="position: absolute; top: 10%; right: 10%; width: 100px; height: 100px; border: 3px solid rgba(255,255,255,0.2); border-radius: 50%;"></div>
        <div style="position: absolute; bottom: 15%; left: 15%; width: 150px; height: 150px; border: 3px solid rgba(255,255,255,0.15); border-radius: 50%;"></div>
    </div>
</section>
</body>
</html>
