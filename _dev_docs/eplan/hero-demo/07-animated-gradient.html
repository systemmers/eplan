<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Style 07: Animated Gradient - ePlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    STYLE 7: Animated Gradient Hero
    - 애니메이션 그라데이션 배경
    - 동적인 느낌
    - 시선 집중 효과

    적용 대상: 이벤트, 프로모션, 신규 서비스 런칭
    로고: ../../app/static/images/eplan_logo_white.png
-->
<section style="
    position: relative;
    height: 100vh;
    min-height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #00635C, #63A19B, #FFB74D, #FF8A65);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    text-align: center;
    color: white;
">
    <div style="max-width: 800px; padding: 2rem;">
        <!-- Logo -->
        <img src="../../app/static/images/eplan_logo_white.png" alt="ePlan" style="
            height: 70px;
            margin-bottom: 2rem;
        ">
        <h1 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 800;
            margin-bottom: 1.5rem;
            text-shadow: 0 4px 30px rgba(0,0,0,0.3);
        ">Transform Your Future</h1>
        <p style="
            font-size: clamp(1.125rem, 2.5vw, 1.5rem);
            opacity: 0.95;
            margin-bottom: 2rem;
            line-height: 1.6;
        ">글로벌 시대, 영어는 선택이 아닌 필수입니다.<br>ePlan과 함께 새로운 가능성을 열어보세요.</p>
        <button style="
            background: white;
            color: #00635C;
            padding: 1rem 2.5rem;
            border: none;
            border-radius: 50px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        ">시작하기</button>
    </div>
</section>
</body>
</html>
