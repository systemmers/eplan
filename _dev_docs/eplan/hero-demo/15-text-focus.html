<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Style 15: Text Focus - ePlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    STYLE 15: Text Focus Hero
    - 텍스트 중심 디자인
    - 대형 타이포그래피 강조
    - 메시지 전달력 극대화

    적용 대상: 미션/비전 페이지, 브랜드 스토리
    로고: ../../app/static/images/eplan_logo.png
-->
<section style="
    position: relative;
    height: 100vh;
    min-height: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #FAFAFA;
    color: #263238;
    text-align: center;
    padding: 2rem;
">
    <!-- Content -->
    <div style="max-width: 1100px;">
        <!-- Logo -->
        <img src="../../app/static/images/eplan_logo.png" alt="ePlan" style="
            height: 60px;
            margin-bottom: 2rem;
        ">
        <p style="
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: #00635C;
            margin-bottom: 3rem;
        ">ePlan Education Since 2015</p>

        <h1 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 900;
            line-height: 0.9;
            margin-bottom: 2rem;
            color: #263238;
        ">
            <span style="display: block; font-weight: 300; font-size: 0.5em; color: #90A4AE; margin-bottom: 0.5rem;">글로벌 교육의</span>
            혁신
        </h1>

        <p style="
            font-size: clamp(1.25rem, 3vw, 2rem);
            color: #607D8B;
            margin-bottom: 2rem;
            line-height: 1.6;
        ">지식 파트너십을 통한<br>글로벌 성공 역량 강화</p>

        <div style="
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            margin: 3rem 0;
        ">
            <span style="flex: 1; max-width: 100px; height: 2px; background: #00635C;"></span>
            <p style="
                font-family: 'Poppins', sans-serif;
                font-size: clamp(1.5rem, 4vw, 3rem);
                font-style: italic;
                font-weight: 700;
                color: #00635C;
                margin: 0;
            ">Practice Makes Perfect!</p>
            <span style="flex: 1; max-width: 100px; height: 2px; background: #00635C;"></span>
        </div>

        <p style="
            font-size: 1.25rem;
            color: #90A4AE;
            margin-bottom: 3rem;
        ">Your success is just around the corner.</p>

        <div style="display: flex; gap: 1rem; justify-content: center;">
            <button style="
                background: #00635C;
                color: white;
                padding: 1.25rem 3rem;
                border: none;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
            ">무료 상담 신청</button>
            <button style="
                background: transparent;
                color: #00635C;
                padding: 1.25rem 3rem;
                border: 2px solid #00635C;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
            ">서비스 둘러보기</button>
        </div>
    </div>
</section>
</body>
</html>
