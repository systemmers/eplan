<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero + Nav Cards - ePlan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Open Sans', sans-serif;">
<!--
    STYLE 01: Hero + Navigation Cards
    - 메인 페이지 스타일의 네비게이션 카드
    - 비디오 배경 + 하단 카드 그리드
    - 각 서비스로 빠른 이동
-->
<section style="
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: #0a0a0a;
    color: white;
    overflow: hidden;
">
    <!-- Video Background -->
    <video style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
    " autoplay muted loop playsinline>
        <source src="../../app/static/videos/main.mp4" type="video/mp4">
    </video>

    <!-- Overlay -->
    <div style="
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.7) 100%);
        z-index: 1;
    "></div>

    <!-- Hero Content -->
    <div style="
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
    ">
        <img src="../../app/static/images/eplan_logo_white.png" alt="ePlan" style="
            height: 70px;
            margin-bottom: 2rem;
        ">
        <h1 style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
        ">Global Education Innovation</h1>
        <p style="
            font-size: clamp(1rem, 2vw, 1.5rem);
            opacity: 0.9;
            margin-bottom: 0.5rem;
        ">Knowledge Partnership for Global Success</p>
        <p style="
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 600;
            font-style: italic;
            color: #FFB74D;
            margin: 1.5rem 0;
        ">Practice Makes Perfect!</p>
    </div>

    <!-- Navigation Cards -->
    <div style="
        position: relative;
        z-index: 2;
        padding: 0 2rem 3rem;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        box-sizing: border-box;
    ">
        <div style="
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        ">
            <!-- Card 1 -->
            <a href="#" style="
                background: rgba(255,255,255,0.1);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.2);
                border-radius: 16px;
                padding: 2rem 1.5rem;
                text-align: center;
                text-decoration: none;
                color: white;
                transition: all 0.3s ease;
            ">
                <div style="
                    width: 60px;
                    height: 60px;
                    background: rgba(0, 99, 92, 0.3);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    margin: 0 auto 1rem;
                ">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                        <line x1="12" y1="18" x2="12.01" y2="18"></line>
                    </svg>
                </div>
                <h3 style="
                    font-family: 'Poppins', sans-serif;
                    font-size: 1.125rem;
                    font-weight: 600;
                    margin-bottom: 0.5rem;
                ">Phone English</h3>
                <p style="
                    font-size: 0.875rem;
                    opacity: 0.8;
                ">1:1 Customized Lessons</p>
            </a>

            <!-- Card 2 -->
            <a href="#" style="
                background: rgba(255,255,255,0.1);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.2);
                border-radius: 16px;
                padding: 2rem 1.5rem;
                text-align: center;
                text-decoration: none;
                color: white;
                transition: all 0.3s ease;
            ">
                <div style="
                    width: 60px;
                    height: 60px;
                    background: rgba(0, 99, 92, 0.3);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    margin: 0 auto 1rem;
                ">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
                        <path d="M9 22v-4h6v4"></path>
                    </svg>
                </div>
                <h3 style="
                    font-family: 'Poppins', sans-serif;
                    font-size: 1.125rem;
                    font-weight: 600;
                    margin-bottom: 0.5rem;
                ">Corporate</h3>
                <p style="
                    font-size: 0.875rem;
                    opacity: 0.8;
                ">Corporate Education</p>
            </a>

            <!-- Card 3 -->
            <a href="#" style="
                background: rgba(255,255,255,0.1);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.2);
                border-radius: 16px;
                padding: 2rem 1.5rem;
                text-align: center;
                text-decoration: none;
                color: white;
                transition: all 0.3s ease;
            ">
                <div style="
                    width: 60px;
                    height: 60px;
                    background: rgba(0, 99, 92, 0.3);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    margin: 0 auto 1rem;
                ">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                        <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                    </svg>
                </div>
                <h3 style="
                    font-family: 'Poppins', sans-serif;
                    font-size: 1.125rem;
                    font-weight: 600;
                    margin-bottom: 0.5rem;
                ">Writing</h3>
                <p style="
                    font-size: 0.875rem;
                    opacity: 0.8;
                ">Writing Correction</p>
            </a>

            <!-- Card 4 -->
            <a href="#" style="
                background: rgba(255,255,255,0.1);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.2);
                border-radius: 16px;
                padding: 2rem 1.5rem;
                text-align: center;
                text-decoration: none;
                color: white;
                transition: all 0.3s ease;
            ">
                <div style="
                    width: 60px;
                    height: 60px;
                    background: rgba(255, 183, 77, 0.3);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    margin: 0 auto 1rem;
                ">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                </div>
                <h3 style="
                    font-family: 'Poppins', sans-serif;
                    font-size: 1.125rem;
                    font-weight: 600;
                    margin-bottom: 0.5rem;
                ">Consulting</h3>
                <p style="
                    font-size: 0.875rem;
                    opacity: 0.8;
                ">Free Consultation</p>
            </a>
        </div>
    </div>
</section>
</body>
</html>
